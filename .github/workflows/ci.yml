name: DeepShield CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Lint & Format ────────────────────────────────────
  lint:
    name: "🔍 Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff black isort mypy
      - run: ruff check src/ tests/
      - run: black --check src/ tests/
      - run: isort --check-only src/ tests/

  # ─── Unit Tests ───────────────────────────────────────
  test:
    name: "🧪 Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short -m "not slow" --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v3
        with:
          file: coverage.xml

  # ─── Build Docker Image ──────────────────────────────
  docker:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: deepshield:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Security Scan ───────────────────────────────────
  security:
    name: "🛡️ Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit safety
      - run: bandit -r src/ -ll
      - run: safety check

  # ─── Integration Tests ───────────────────────────────
  integration:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: test
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v -m "integration"
        env:
          DEEPSHIELD_REDIS__URL: redis://localhost:6379/0
