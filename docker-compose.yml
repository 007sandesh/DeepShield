version: '3.8'

services:
  # ─── DeepShield API ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEEPSHIELD_ENV=production
      - DEEPSHIELD_MODEL__DEVICE=auto
    volumes:
      - model-weights:/app/models/weights
      - upload-data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  model-weights:
  upload-data:
