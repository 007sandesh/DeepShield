version: '3.8'

services:
  # ─── DeepShield API ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEEPSHIELD_ENV=production
      - DEEPSHIELD_MODEL__DEVICE=auto
      - DEEPSHIELD_DATABASE__URL=postgresql://deepshield:deepshield@postgres:5432/deepshield
      - DEEPSHIELD_REDIS__URL=redis://redis:6379/0
    volumes:
      - model-weights:/app/models/weights
      - upload-data:/app/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deepshield
      POSTGRES_USER: deepshield
      POSTGRES_PASSWORD: deepshield
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # ─── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ─── Prometheus ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  # ─── Grafana ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  model-weights:
  upload-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
